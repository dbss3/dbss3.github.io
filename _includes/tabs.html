<nav class="tabs" aria-label="Main">
	<ul>
		{%- for item in site.data.navigation %}
		<li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}{% if item.full %} title="{{ item.full }}"{% endif %}>{{ item.title }}</a></li>
		{%- endfor %}
		<li class="dropdown">
			<a href="{{ '/projects.html' | relative_url }}" class="dropdown-toggle{% if page.url == '/projects.html' %} active{% endif %}" aria-haspopup="true">Projects</a>
			<ul class="dropdown-menu">
				{%- for project in site.data.projects %}
				<li><a href="{{ project.url | relative_url }}"><strong>{{ project.name }}</strong><span>{{ project.tagline }}</span></a></li>
				{%- endfor %}
				<li class="all"><a href="{{ '/projects.html' | relative_url }}">All projects &rarr;</a></li>
			</ul>
		</li>
	</ul>
</nav>
